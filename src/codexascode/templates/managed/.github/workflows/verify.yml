name: Workspace verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned toolkit release
        run: python -m pip install 'git+https://github.com/nielslindor/CaC.git@v{{version}}'
      - name: Check workspace and lifecycle records
        run: cac gauntlet --root .
      - name: Verify managed configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: cac verify --root .
