name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install . build==1.3.0
      - name: Check release record for the tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os, codexascode; assert os.environ["RELEASE_TAG"] == "v" + codexascode.__version__'
          cac change check "release-${RELEASE_TAG#v}" --stage released
      - run: python tools/package.py
      - run: python tools/smoke.py --wheel dist/codexascode-0.1.1-py3-none-any.whl
      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "CodexasCode $RELEASE_TAG" --notes-file CHANGELOG.md
