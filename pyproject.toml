[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codexascode"
version = "0.1.2"
description = "Declarative agent workspaces with an executable software development lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CodexasCode contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX", "Topic :: Software Development :: Build Tools"]

[project.scripts]
cac = "codexascode.cli:main"

[project.urls]
Repository = "https://github.com/nielslindor/CaC"
Issues = "https://github.com/nielslindor/CaC/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codexascode = ["templates/**/*", "templates/**/.*", "templates/**/.*/**/*"]
